<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Album | WDD 131</title>
    <meta name="description" content="W02 Picture Album assignment showcasing a responsive gallery of temples with interactive navigation.">
    <!-- Google Fonts API -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Open+Sans&display=swap" rel="stylesheet">
    <!-- Stylesheets: Mobile-first ordering -->
    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css" media="screen and (min-width: 32rem)">
    <!-- JavaScript: Deferred execution -->
    <script src="scripts/temples.js" defer></script>
</head>
<body>
    <header>
        <h1>Temple Album</h1>
        <button id="menuButton" aria-label="Toggle Menu" aria-expanded="false"></button>
        <nav id="navMenu">
            <a href="#" class="active">Home</a>
            <a href="#">Old</a>
            <a href="#">New</a>
            <a href="#">Large</a>
            <a href="#">Small</a>
        </nav>
    </header>

  <main>
  <h2>Explore Beautiful Temples</h2>

  <div class="gallery-grid">

    <figure>
      <img src="images/salt-lake-temple.webp"
           alt="Salt Lake Temple with granite spires and historic architecture"
           loading="lazy" width="400" height="300">
      <figcaption>Salt Lake Temple</figcaption>
    </figure>

    <figure>
      <img src="images/manti-temple.webp"
           alt="Manti Utah Temple on a hilltop with classical design"
           loading="lazy" width="400" height="300">
      <figcaption>Manti Temple</figcaption>
    </figure>

    <figure>
      <img src="images/logan-temple.webp"
           alt="Logan Utah Temple surrounded by greenery and spires"
           loading="lazy" width="400" height="300">
      <figcaption>Logan Temple</figcaption>
    </figure>

    <figure>
      <img src="images/laie-hawaii-temple.webp"
           alt="Laie Hawaii Temple with palm trees and tropical landscape"
           loading="lazy" width="400" height="300">
      <figcaption>Laie Hawaii Temple</figcaption>
    </figure>

    <figure>
      <img src="images/cardston-alberta-temple.webp"
           alt="Cardston Alberta Temple with geometric architectural design"
           loading="lazy" width="400" height="300">
      <figcaption>Cardston Alberta Temple</figcaption>
    </figure>

    <figure>
      <img src="images/mesa-arizona-temple.webp"
           alt="Mesa Arizona Temple featuring detailed stone craftsmanship"
           loading="lazy" width="400" height="300">
      <figcaption>Mesa Arizona Temple</figcaption>
    </figure>

    <figure>
      <img src="images/idaho-falls-temple.webp"
           alt="Idaho Falls Temple illuminated near the river at night"
           loading="lazy" width="400" height="300">
      <figcaption>Idaho Falls Temple</figcaption>
    </figure>

    <figure>
      <img src="images/los-angeles-temple.webp"
           alt="Los Angeles California Temple with tall central spire"
           loading="lazy" width="400" height="300">
      <figcaption>Los Angeles California Temple</figcaption>
    </figure>

    <figure>
      <img src="images/bern-switzerland-temple.webp"
           alt="Bern Switzerland Temple with European architectural style"
           loading="lazy" width="400" height="300">
      <figcaption>Bern Switzerland Temple</figcaption>
    </figure>

  </div>
</main>
    <footer>
        <p>&copy; <span id="currentYear"></span> | Ongom Ronald | Lira, Uganda</p>

        <p id="lastModified"></p>
    </footer>
</body>
</html>
