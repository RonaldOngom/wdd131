<head>

<body>

<a class="skip-link" href="#main">Skip to main content</a>

<header>
    <div class="logo">
    <img 
        src="images/logo.webp"
        alt="Kairos Waves Technologies logo"
        width="80"
        height="80">
    <span>Kairos Waves Technologies</span>
</div>
    <nav aria-label="Primary navigation">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>

        </ul>
    </nav>
</header>

<main id="main">
    <section>
        <h1>Contact Us</h1>
        <p>Please fill out the form below and we will respond as soon as possible.</p>
    </section>

    <section>
        <form id="contactForm">
            <fieldset>
                <legend>Contact Information</legend>

                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </fieldset>

            <button type="submit">Submit</button>
            <div id="contact-feedback" role="status" aria-live="polite" class="form-feedback"></div>
        </form>
    </section>
</main>

<footer>
